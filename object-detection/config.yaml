# SiMa Neat object detection
#
# Paths are DevKit paths, relative to where you launch app.py (~/object-detection).
# Windows paths (C:\ D:\) cannot work: the app runs on Linux.

model:
  path: assets/models/yolo26m-det-bf16-mla_tess-b1.tar.gz
  labels: src/coco_labels.txt

  # Detection head. Must match your model or you get no detections.
  # yolo | yolov5 | yolov6 | yolov7 | yolov8 | yolov9 | yolov10 
  # | yolo11 | yolo26 | yolox
  # Add -seg or -pose for those variants. yolo11 maps to the YOLOv8 head.
  family: yolo26

  decode_type_option: auto            # head packing override, leave auto for SiMa model packs
  num_classes: 0                      # 0 = read from the model archive

source:
  type: video                          # video | rtsp | usb
  uri: assets/videos/video-1.h264    # .h264 only, see note below

  # Leave these at 0. For .h264 the app reads the real geometry out of the
  # stream's SPS, and the stream always wins over anything set here.
  fps: 0
  width: 0
  height: 0

  rtsp:
    codec: h264                        # h264 | mjpeg
    tcp: true
    latency_ms: 100

  usb:
    camera_name: ""                    # "" = DevKit default camera
    format: NV12

# Use a raw H.264 elementary stream, not .mp4. Containers hit a demuxer bug in
# Neat 0.3.0. Convert and loop in one step (looping gives you time to open Insight):
#   ffmpeg -stream_loop 9 -i clip.mp4 -c:v copy -bsf:v h264_mp4toannexb -f h264 video-loop.h264

preprocess:
  # What the app asks for. The route planner resolves it against the model
  # archive and compiles the matching graph. `auto` means "planner decides".
  kind: image                # image | tensor | auto
  enable: on                 # on | off | auto

  input_format: NV12         # what the source produces: NV12 for video/rtsp/usb, BGR for images
  output_format: auto        # auto = take it from the model contract

  input_max_width: 0         # 0 = use the probed source size
  input_max_height: 0

  resize:
    enable: on
    width: 0                 # 0 = infer from the model (640x640 for most YOLO)
    height: 0
    mode: letterbox          # letterbox (YOLO default) | stretch | crop
    pad_value: 114
    scaling_type: BILINEAR   # BILINEAR | NEAREST_NEIGHBOUR | BICUBIC | INTERAREA | NO_SCALING

  normalize:
    enable: on
    preset: coco_yolo        # coco_yolo (all YOLO) | imagenet | none
    mean: [0.0, 0.0, 0.0]    # only read when preset is none
    stddev: [1.0, 1.0, 1.0]

  # Leave both auto. The model pack's dtype contract decides whether these run
  # in the preprocess graph or inside the MLA.
  quantize:
    enable: auto
    zero_point: 0
    scale: 0.0               # 0.0 = use the model's calibration
  tessellate:
    enable: auto
    slice_shape: []          # empty = use the contract geometry

decode:
  score_threshold: 0.30      # minimum confidence, 0.0 keeps the packaged value
  nms_iou: 0.60              # overlap threshold for non-max suppression
  max_detections: 50         # top-K cap per frame

runtime:
  frames: 0                  # 0 = run until interrupted
  pull_timeout_ms: 20000     # how long to wait for a frame before giving up
  queue_depth: 3
  # auto splits on source type, because a file and a camera want opposites:
  #   file        -> reliable + block       every frame is kept, no deadline
  #   rtsp / usb  -> realtime + keep_latest stay current, a camera cannot pause
  # Forcing keep_latest on a file is what makes the recording short and fast:
  # inference is slower than decoding, the surplus frames are discarded, and the
  # survivors are still written at the source rate.
  preset: auto               # auto | realtime | balanced | reliable
  overflow_policy: auto      # auto | block | keep_latest | drop_incoming
  profile: false             # per-stage timings
  profile_interval: 100

# How the overlay looks. Sizes are in pixels for a 1080p frame; with
# auto_scale on they are multiplied by (frame height / reference_height), so 4K
# does not get hairlines and 480p does not get slabs. Colours are [B, G, R]
# because OpenCV is BGR, so [0, 0, 255] is red.
visualization:
  box_thickness: 3           # detection rectangle outline weight
  text_scale: 1.0            # caption font size multiplier
  text_thickness: 2          # caption stroke weight
  text_padding: 10           # gap between caption text and the edge of its band

  centre_dot: on             # filled dot at the centre of each box
  centre_dot_radius: 7

  show_labels: on            # class name in the caption
  show_scores: on            # confidence in the caption
  score_decimals: 2          # 2 gives "person 0.57", 0 gives "person 1"

  text_color: [255, 255, 255]   # caption text, white

  auto_scale: on             # scale every size above with the frame height
  reference_height: 1080     # the height those sizes are tuned for

  # The FPS badge in the corner, drawn when output.video.hud is true.
  # text_scale, text_thickness and padding follow the caption settings above
  # when left at 0. Padding is what sets the badge size; the two minimums can
  # only make it bigger, and the text stays centred either way.
  hud:
    text_color: [104, 31, 17]
    bg_color: [255, 255, 255]
    text_scale: 2.0          # 0 = follow text_scale above
    text_thickness: 5        # 0 = follow text_thickness above
    padding: 15              # 0 = follow text_padding above
    min_width: 0             # 0 = fit the text
    min_height: 0            # 0 = fit the text

output:

  # Annotated video written on the DevKit, one entry per processed frame.
  # Survives the run, unlike the UDP feed.
  video:
    enable: true
    path: detections.mp4
    codec: mp4v              # 4-char FourCC, falls back to MJPG/.avi automatically
    fps: 0                   # 0 = match the source
    hud: true                # small FPS badge in the top-left corner

  # Annotated stills.
  save:
    enable: true
    dir: frames
    every: 1                 # write every Nth frame, 0 disables
    overlay: true
    format: jpg              # jpg | png

  # Live feed to Neat Insight (H.264 RTP video + JSON metadata, both UDP).
  insight:
    enable: true
    annotated: true           # send our overlay. false sends raw and lets Insight draw
    host: 192.168.137.1       # your PC ip address as the DevKit sees it, NOT 127.0.0.1
    channel: 0                # video port = video_port_base + channel
    video_port_base: 9000
    metadata_port_base: 9100
    bitrate_kbps: 2000
