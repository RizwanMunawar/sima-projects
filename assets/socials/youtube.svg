      <rect x="-26" y="-26" width="52" height="52" rx="16" fill="#FF0000" opacity="0.28">
        <animate attributeName="opacity" values="0.28;0;0.28" dur="2.8s" begin="0.54s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
                          values="1;1.16;1" dur="2.8s" begin="0.54s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- tile, floating -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -4; 0 0" dur="2.8s" begin="0.54s"
                        repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      <rect x="6" y="6" width="52" height="52" rx="16" fill="#FF0000"/>
      <g transform="translate(20 20) scale(1)" fill="#FFFFFF">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814ZM9.545 15.568V8.432L15.818 12l-6.273 3.568Z"/>
      </g>
    </g>
  </g>
