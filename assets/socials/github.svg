      <rect x="-26" y="-26" width="52" height="52" rx="16" fill="#181717" opacity="0.28">
        <animate attributeName="opacity" values="0.28;0;0.28" dur="2.8s" begin="0.0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
                          values="1;1.16;1" dur="2.8s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- tile, floating -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -4; 0 0" dur="2.8s" begin="0.0s"
                        repeatCount="indefinite" calcMode="spline"
