<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="linkedin">
  <g>
    <!-- halo, breathing out from under the tile; translated so the scale is centred -->
    <g transform="translate(32 32)">
      <rect x="-26" y="-26" width="52" height="52" rx="16" fill="#0A66C2" opacity="0.28">
        <animate attributeName="opacity" values="0.28;0;0.28" dur="2.8s" begin="0.18s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
                          values="1;1.16;1" dur="2.8s" begin="0.18s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- tile, floating -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -4; 0 0" dur="2.8s" begin="0.18s"
                        repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      <rect x="6" y="6" width="52" height="52" rx="16" fill="#0A66C2"/>
      <g transform="translate(20 20) scale(1)" fill="#FFFFFF">
