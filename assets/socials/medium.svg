<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="medium">
  <g>
    <!-- halo, breathing out from under the tile; translated so the scale is centred -->
    <g transform="translate(32 32)">
      <rect x="-26" y="-26" width="52" height="52" rx="16" fill="#000000" opacity="0.28">
        <animate attributeName="opacity" values="0.28;0;0.28" dur="2.8s" begin="0.72s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
                          values="1;1.16;1" dur="2.8s" begin="0.72s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- tile, floating -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -4; 0 0" dur="2.8s" begin="0.72s"
                        repeatCount="indefinite" calcMode="spline"
                        keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      <rect x="6" y="6" width="52" height="52" rx="16" fill="#000000"/>
      <g transform="translate(20 20) scale(1)" fill="#FFFFFF">
        <path d="M13.54 12a6.8 6.8 0 01-6.77 6.82A6.8 6.8 0 010 12a6.8 6.8 0 016.77-6.82A6.8 6.8 0 0113.54 12zM20.96 12c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z"/>
      </g>
    </g>
  </g>
</svg>
