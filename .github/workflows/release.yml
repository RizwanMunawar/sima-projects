name: Release

# Publishing is deliberately manual: nothing reaches PyPI until a `v*` tag is
# pushed on purpose.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Authentication is PyPI Trusted Publishing (OIDC), so there is no API token to
# store or rotate. Before the first release, add a pending publisher at
# https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : sima-vision
#   Owner             : RizwanMunawar
#   Repository        : sima-projects
#   Workflow name     : release.yml
#   Environment       : pypi
#
# The `test-pypi` job runs first on every tag, so a broken package is caught on
# TestPyPI before it can burn a version number on the real index -- a published
# version can never be reused, even after deletion.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Publish to TestPyPI only"
        type: boolean
        default: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]" numpy opencv-python-headless

      - name: Lint and test
        run: |
          ruff check sima_vision tests
          pytest -q

      - name: Check the tag matches the package version
        # A tag that disagrees with pyproject.toml publishes the wrong version
        # under the right name, and PyPI will not let you take it back.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          }

      - name: Build
        run: python -m build

      - name: Check the metadata PyPI will see
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-pypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/sima-vision
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run of the same tag should not fail the whole release.
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: test-pypi
    # Only a real tag publishes for real; a manual run stops at TestPyPI unless
    # test_only is explicitly turned off.
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.test_only
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sima-vision
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: attach the artifacts to the GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
