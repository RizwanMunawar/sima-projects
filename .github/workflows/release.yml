name: Release

# Releasing is one line in one file. Bump `__version__` in
# sima_vision/__init__.py, open a PR, merge it, and this publishes to PyPI and
# tags the commit. Nothing else to remember, and no tag to push by hand.
#
# `__init__.py` is the only place the version is written: pyproject.toml reads
# it through `[tool.hatch.version]`. A second copy could ship a wheel labelled
# with the version you did not bump.
#
# Nothing is published unless that line actually changed. The check compares
# the merge commit with its first parent and then refuses anyway if a `v<X>`
# tag already exists, so a re-run, a revert or a doc-only merge cannot publish
# twice. `skip-existing` on the upload is the last line of defence.
#
# Authentication is PyPI Trusted Publishing (OIDC): no API token to store or
# rotate. Before the first release, add a pending publisher at
# https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : sima-vision
#   Owner             : RizwanMunawar
#   Repository        : sima-projects
#   Workflow name     : release.yml
#   Environment       : pypi
#
# Every claim has to match or the upload fails with `invalid-publisher`, which
# is what a missing publisher looks like rather than a permissions error.
#
# There is no TestPyPI rehearsal. What that step was really checking is that
# the artifact uploads and installs, so `install` does the second half for real
# on all three platforms and gates the publish. A version number on PyPI can
# never be reused, even after deletion.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish the current version even if it did not change"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: has the version changed?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The parent commit has to be here to diff against, and tags have to
          # be here to answer "have we already published this one".
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          read_version() {
            git show "$1:sima_vision/__init__.py" 2>/dev/null \
              | sed -n 's/^__version__ = "\(.*\)"/\1/p' | head -1
          }

          now="$(read_version HEAD)"
          test -n "$now" || { echo "::error::no __version__ in sima_vision/__init__.py"; exit 1; }
          echo "version=$now" >> "$GITHUB_OUTPUT"

          # First parent, so a merge is compared with what main was before it
          # rather than with the branch that was merged in.
          before="$(read_version HEAD^ || true)"
          echo "before=${before:-<none>} now=$now"

          publish=false
          if [ "${{ inputs.force }}" = "true" ]; then
            reason="forced by hand"
            publish=true
          elif [ "$now" = "$before" ]; then
            reason="__version__ is unchanged at $now"
          elif git rev-parse -q --verify "refs/tags/v$now" >/dev/null; then
            reason="v$now is already tagged, so it has been released"
          else
            reason="__version__ went ${before:-<none>} -> $now"
            publish=true
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          {
            echo "### Release check"
            echo ""
            echo "- version: \`$now\`"
            echo "- publish: **$publish** ($reason)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]" numpy opencv-python-headless

      - name: Lint and test
        run: |
          ruff check sima_vision tests
          pytest -q

      - name: Build
        run: python -m build

      - name: Check the version the artifacts actually carry
        # pyproject reads __init__.py, so these agree by construction. Checked
        # anyway: this is the number that becomes permanent on PyPI.
        run: |
          set -euo pipefail
          want="${{ needs.version.outputs.version }}"
          ls dist/
          test -f "dist/sima_vision-$want-py3-none-any.whl" \
            || { echo "::error::no wheel for $want"; exit 1; }
          test -f "dist/sima_vision-$want.tar.gz" \
            || { echo "::error::no sdist for $want"; exit 1; }

      - name: Check the metadata PyPI will see
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install:
    name: install the wheel (${{ matrix.os }})
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install it with nothing else
        # What `pip install sima-vision` gives you on a fresh DevKit: the wheel
        # and its one declared dependency, no numpy and no OpenCV.
        shell: bash
        run: pip install --quiet dist/*.whl

      - name: Run it from an empty directory
        # Nothing in a checkout can be what makes this pass; there is no
        # checkout in this job at all.
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          sima-vision --version | grep -F "${{ needs.version.outputs.version }}"
          sima-vision --help | grep -F "sima-vision detect"
          sima-vision detect --validate
          sima-vision segment --validate
          sima-vision fall --validate
          sima-vision detect --validate --quiet
          test ! -d assets   # --validate must not have downloaded anything

  pypi:
    name: publish ${{ needs.version.outputs.version }} to PyPI
    needs: [version, install]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sima-vision
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run must not fail the whole release on "already uploaded".
          skip-existing: true

  tag:
    name: tag v${{ needs.version.outputs.version }}
    needs: [version, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The tag is created after the upload, not before, so its existence
      # means "this version is on PyPI" and the version job can rely on it.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
