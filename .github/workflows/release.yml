name: Release

# Publishing is deliberately manual: nothing reaches PyPI until a `v*` tag is
# pushed on purpose.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must point at the commit you mean. `git tag` tags whatever HEAD is,
# so if `git pull` failed you will tag the wrong thing, and a tag on a commit
# without this file cannot start this workflow at all.
#
# Authentication is PyPI Trusted Publishing (OIDC), so there is no API token to
# store or rotate. Before the first release, add a pending publisher at
# https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : sima-vision
#   Owner             : RizwanMunawar
#   Repository        : sima-projects
#   Workflow name     : release.yml
#   Environment       : pypi
#
# Every claim has to match or the upload fails with `invalid-publisher`, which
# is what a missing publisher looks like rather than a permissions error.
#
# There is no TestPyPI rehearsal. What that step was really checking is that
# the artifact uploads and installs, so `install` now does the second half for
# real on all three platforms, and it gates the publish. A version number on
# PyPI can never be reused, even after deletion, so nothing should reach it
# that has not been installed from a wheel first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]" numpy opencv-python-headless

      - name: Lint and test
        run: |
          ruff check sima_vision tests
          pytest -q

      - name: Check the tag matches the package version
        # A tag that disagrees with pyproject.toml publishes the wrong version
        # under the right name, and PyPI will not let you take it back.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          }

      - name: Build
        run: python -m build

      - name: Check the metadata PyPI will see
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install:
    name: install the wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install it with nothing else
        # What `pip install sima-vision` gives you on a fresh DevKit: the wheel
        # and its one declared dependency, no numpy and no OpenCV.
        shell: bash
        run: pip install --quiet dist/*.whl

      - name: Run it from an empty directory
        # Nothing in a checkout can be what makes this pass; there is no
        # checkout in this job at all.
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          sima-vision --version
          sima-vision doctor
          sima-vision detect --validate
          sima-vision segment --validate
          sima-vision fall --validate
          test ! -d assets   # --validate must not have downloaded anything

  pypi:
    name: publish to PyPI
    needs: install
    # Only a real tag publishes. A manual run builds, tests and installs the
    # wheel, then stops, which is the rehearsal TestPyPI used to be.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sima-vision
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of the same tag should not fail the whole release.
          skip-existing: true

  github-release:
    name: attach the artifacts to the GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
