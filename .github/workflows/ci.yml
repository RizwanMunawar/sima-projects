name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # opencv-python-headless and numpy are not runtime dependencies: the
        # DevKit provides both. They are installed here so the mask, compositing
        # and overlay tests actually run instead of being skipped.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" numpy opencv-python-headless

      - name: Lint
        run: ruff check sima_vision tests

      - name: Test
        run: pytest -q

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the metadata PyPI will see
        run: twine check dist/*

      - name: Install the wheel somewhere clean and run it
        # The wheel must work with nothing but its declared dependency, which is
        # what `pip install sima-vision` gives you on a fresh DevKit.
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/sima-vision --version
          cd /tmp
          /tmp/fresh/bin/sima-vision detect --model m.tar.gz --source c.h264 --validate

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
