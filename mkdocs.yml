site_name: SiMa Neat SDK
site_description: Live YOLO object detection on a Modalix DevKit
site_url: https://rizwanmunawar.github.io/sima-projects/
repo_url: https://github.com/RizwanMunawar/sima-projects
repo_name: sima-projects
edit_uri: edit/main/docs/

theme:
  # `material` is the engine. The Vercel look is applied entirely in
  # stylesheets/extra.css: monochrome palette, hairline borders, flat surfaces,
  # tight type. Nothing here should reintroduce Material's colour.
  name: material
  icon:
    repo: fontawesome/brands/github
  font:
    # Vercel ships Geist, which is not on Google Fonts. Inter is its direct
    # predecessor and what Vercel used for years.
    text: Inter
    code: JetBrains Mono
  palette:
    # `scheme` only accepts `default` and `slate`. Black keeps Material from
    # tinting the header, which the Vercel style does not do.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    # Top-level sections become a bar under the header, so the sidebar only ever
    # shows the section you are in. This is what gives the nav its shape.
    - navigation.tabs
    - navigation.tabs.sticky
    # Render only the visible part of the tree, so the sidebar stays short.
    - navigation.prune
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      # No pilcrow after headings. Heading ids are still generated, so deep
      # links such as page/#section keep working, you just cannot click a ¶ to
      # copy one.
      permalink: false
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      # Adds language-<lang> to the .highlight wrapper, which docs/stylesheets
      # /extra.css uses to colour each block by language.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys

plugins:
  - search

nav:
  - Home: index.md
  - Setup:
      - setup/index.md
      - Connect the DevKit: setup/hardware.md
      - WSL and networking: setup/wsl.md
      - sima-cli, Docker, SDK: setup/sdk.md
      - Download a model: setup/model.md
  - Running the app:
      - app/index.md
      - Deploy and run: app/deploy.md
      - Seeing the results: app/results.md
      - Configuration: app/configuration.md
      - How it works: app/internals.md
      - Daily loop: app/daily-loop.md
  - Help:
      - help/index.md
      - Troubleshooting: help/troubleshooting.md
      - Recovery: help/recovery.md
      - Known issues: help/known-issues.md
  - Reference: reference.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RizwanMunawar/sima-projects
    - icon: fontawesome/solid/microchip
      link: https://sima.ai

copyright: Built with the neat-application-builder playbook
