site_name: SiMa Neat SDK
site_description: Live YOLO object detection on a Modalix DevKit
site_url: https://rizwanmunawar.github.io/sima-projects/
repo_url: https://github.com/RizwanMunawar/sima-projects
repo_name: RizwanMunawar/sima-projects
edit_uri: edit/main/docs/

theme:
  # Must be `material`. Dracula is a colour palette rather than a theme, so it
  # is applied by overriding Material's CSS variables in stylesheets/extra.css.
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    # `scheme` only accepts `default` and `slate`. Anything else aborts the build.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      # No pilcrow after headings. Heading ids are still generated, so deep
      # links such as page/#section keep working, you just cannot click a ¶ to
      # copy one.
      permalink: false
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      # Adds language-<lang> to the .highlight wrapper, which docs/stylesheets
      # /extra.css uses to colour each block by language.
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys

plugins:
  - search

nav:
  - Home: index.md
  - Setup:
      - setup/index.md
      - 1. Connect the DevKit: setup/hardware.md
      - 2-4. WSL and networking: setup/wsl.md
      - 5-7. sima-cli, Docker, SDK: setup/sdk.md
      - 8. Download a model: setup/model.md
  - Running the app:
      - app/index.md
      - Deploy and run: app/deploy.md
      - Seeing the results: app/results.md
      - Configuration: app/configuration.md
      - How it works: app/internals.md
      - Daily loop: app/daily-loop.md
  - Help:
      - help/index.md
      - Troubleshooting: help/troubleshooting.md
      - Recovery: help/recovery.md
      - Known issues: help/known-issues.md
  - Reference: reference.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RizwanMunawar/sima-projects
    - icon: fontawesome/solid/microchip
      link: https://sima.ai

copyright: Built with the neat-application-builder playbook
